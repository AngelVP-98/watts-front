<div class="card p-4">
  <p-toast />
  @if (authService.hasPermission('COLOR_CREAR')) {
    <p-toolbar class="mb-4 gap-2">
      <ng-template pTemplate="left">
        <p-button
          label="Nuevo Color"
          icon="pi pi-plus"
          class="mr-2"
          (onClick)="abrirModalCrear()"
        />
      </ng-template>
    </p-toolbar>
  }

  <p-table
    [value]="colores()"
    [paginator]="true"
    [rows]="10"
    [loading]="loading()"
    [rowHover]="true"
    dataKey="id"
    class="p-datatable-sm"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} colores"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 80%">Nombre</th>
        <th style="width: 20%">ID</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-color>
      <tr>
        <td>
          <span class="font-bold">{{ color.nombre }}</span>
        </td>
        <td>{{ color.id }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="2" class="text-center p-4">No se encontraron colores.</td>
      </tr>
    </ng-template>
  </p-table>

  <app-color-form
    [visible]="mostrarModal()"
    (save)="guardarColor($event)"
    (cancel)="cerrarModal()"
  />
</div>
