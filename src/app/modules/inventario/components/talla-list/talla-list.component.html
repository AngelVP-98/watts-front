<div class="card p-4">
  <p-toast />
  @if (authService.hasPermission('TALLA_CREAR')) {
    <p-toolbar class="mb-4 gap-2">
      <ng-template pTemplate="left">
        <p-button
          label="Nueva Talla"
          icon="pi pi-plus"
          class="mr-2"
          (onClick)="abrirModalCrear()"
        />
      </ng-template>
    </p-toolbar>
  }
  <p-table
    [value]="tallas()"
    [paginator]="true"
    [rows]="10"
    [loading]="loading()"
    [rowHover]="true"
    dataKey="id"
    class="p-datatable-sm"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} tallas"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 80%">Nombre</th>
        <th style="width: 20%">ID</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-talla>
      <tr>
        <td>
          <span class="font-bold">{{ talla.nombre }}</span>
        </td>
        <td>{{ talla.id }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="2" class="text-center p-4">No se encontraron tallas.</td>
      </tr>
    </ng-template>
  </p-table>

  <app-talla-form
    [visible]="mostrarModal()"
    (save)="guardarTalla($event)"
    (cancel)="cerrarModal()"
  />
</div>
