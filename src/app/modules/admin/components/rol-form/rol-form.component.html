<p-dialog
  [header]="rolEditar() ? 'Editar Rol' : 'Nuevo Rol'"
  [visible]="visible()"
  [modal]="true"
  [style]="{ width: '450px' }"
  (onHide)="onCancel()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-4 mt-2">
    <div class="flex flex-column gap-2">
      <label for="nombre" class="font-bold">Nombre del Rol</label>
      <input pInputText id="nombre" formControlName="nombre" autofocus />
      @if (form.controls.nombre.dirty && form.controls.nombre.invalid) {
        <small class="text-red-500"
          >El nombre es requerido y debe tener al menos 3 caracteres.</small
        >
      }
    </div>

    <div class="flex flex-column gap-2">
      <label for="permisos" class="font-bold">Permisos</label>
      <p-multiSelect
        id="permisos"
        formControlName="permisos"
        [options]="permisosDisponibles()"
        optionLabel="nombre"
        placeholder="Seleccione permisos"
        display="chip"
        appendTo="body"
        [style]="{ width: '100%' }"
      />
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <p-button label="Cancelar" severity="secondary" (onClick)="onCancel()" />
      <p-button label="Guardar" type="submit" [loading]="saving()" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
