<div class="card p-4">
  <p-toast />
  <p-confirmDialog />

  <p-toolbar class="mb-4 gap-2">
    <ng-template pTemplate="left">
      <p-button
        label="Nuevo Usuario"
        icon="pi pi-plus"
        class="mr-2"
        (onClick)="abrirModalCrear()"
      />
    </ng-template>
  </p-toolbar>

  <p-table
    [value]="usuarios()"
    [lazy]="true"
    (onLazyLoad)="cargarUsuarios($event)"
    [paginator]="true"
    [rows]="pageSize()"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[5, 10, 20]"
    [loading]="loading()"
    [rowHover]="true"
    dataKey="id"
    class="p-datatable-sm"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 25%">Usuario</th>
        <th style="width: 30%">Email</th>
        <th style="width: 15%">Rol</th>
        <th style="width: 15%">Estado</th>
        <th class="text-center" style="width: 15%">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-usuario>
      <tr>
        <td>{{ usuario.username }}</td>
        <td>{{ usuario.email }}</td>
        <td>
          <span
            [class]="
              'px-2 py-1 border-round text-sm font-bold ' +
              (usuario.rol === 'ADMIN'
                ? 'bg-purple-100 text-purple-700'
                : 'bg-blue-100 text-blue-700')
            "
          >
            {{ usuario.rol.nombre }}
          </span>
        </td>
        <td>
          <span
            [class]="
              'px-2 py-1 border-round text-sm font-bold ' +
              (usuario.activo ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')
            "
          >
            {{ usuario.activo ? 'ACTIVO' : 'INACTIVO' }}
          </span>
        </td>
        <td class="text-center">
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="success"
            pTooltip="Editar"
            tooltipPosition="top"
            (onClick)="abrirModalEditar(usuario)"
          />
          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            pTooltip="Eliminar"
            tooltipPosition="top"
            (onClick)="confirmarEliminacion(usuario)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="5" class="text-center p-4">No se encontraron usuarios.</td>
      </tr>
    </ng-template>
  </p-table>

  <app-usuario-form
    [visible]="mostrarModal()"
    [usuarioEditar]="usuarioSeleccionado()"
    (save)="guardarUsuario($event)"
    (cancel)="cerrarModal()"
  />
</div>
