<div class="card p-4">
  <p-toast />
  <p-confirmDialog />

  <p-toolbar class="mb-4 gap-2">
    <ng-template pTemplate="left">
      <p-button label="Nuevo Rol" icon="pi pi-plus" class="mr-2" (onClick)="abrirModalCrear()" />
    </ng-template>
  </p-toolbar>

  <p-table
    [value]="roles()"
    [lazy]="true"
    (onLazyLoad)="cargarRoles($event)"
    [paginator]="true"
    [rows]="pageSize()"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[5, 10, 20]"
    [loading]="loading()"
    [rowHover]="true"
    dataKey="id"
    class="p-datatable-sm"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} roles"
    [expandedRowKeys]="expandedRows"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 3rem"></th>
        <th style="width: 70%">Nombre</th>
        <th class="text-center" style="width: 20%">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rol let-expanded="expanded">
      <tr>
        <td>
          <p-button
            type="button"
            pRipple
            [pRowToggler]="rol"
            [text]="true"
            [rounded]="true"
            [plain]="true"
            [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
          />
        </td>
        <td>
          <span class="font-bold">{{ rol.nombre }}</span>
        </td>
        <td class="text-center">
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="success"
            pTooltip="Editar"
            tooltipPosition="top"
            (onClick)="abrirModalEditar(rol)"
          />
          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            pTooltip="Eliminar"
            tooltipPosition="top"
            (onClick)="confirmarEliminacion(rol)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #expandedrow let-rol>
      <tr>
        <td colspan="3">
          <div class="p-2">
            <h4 class="mb-3 text-900 font-bold">
              <i class="pi pi-shield mr-2"></i>Permisos del rol {{ rol.nombre }}
            </h4>
            <div class="flex flex-wrap gap-2">
              @for (permiso of rol.permisos; track permiso.id) {
                <span class="px-2 py-1 bg-blue-300 text-blue-800 border-round text-sm font-bold">
                  {{ permiso.nombre }}
                </span>
              } @empty {
                <span class="text-500 font-italic">Este rol no tiene permisos asignados.</span>
              }
            </div>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="3" class="text-center p-4">No se encontraron roles.</td>
      </tr>
    </ng-template>
  </p-table>

  <app-rol-form
    [visible]="mostrarModal()"
    [rolEditar]="rolSeleccionado()"
    (save)="guardarRol($event)"
    (cancel)="cerrarModal()"
  />
</div>
