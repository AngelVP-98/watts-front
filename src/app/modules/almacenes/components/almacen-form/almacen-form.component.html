<p-dialog
  [header]="almacenEditar() ? 'Editar Almacen' : 'Nuevo Almacen'"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="onCancel()"
  [style]="{ width: '450px' }"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
    <div class="flex flex-column gap-2">
      <label for="codigo" class="font-bold">Código</label>
      <input pInputText id="codigo" formControlName="codigo" />
      @if (form.controls.codigo.invalid && form.controls.codigo.touched) {
        <small class="text-red-500">El código es requerido.</small>
      }
    </div>

    <div class="flex flex-column gap-2">
      <label for="descripcion" class="font-bold">Descripcion</label>
      <input pInputText id="descripcion" formControlName="descripcion" />
      @if (form.controls.descripcion.invalid && form.controls.descripcion.touched) {
        <small class="text-red-500">La descripcion es requerida.</small>
      }
    </div>

    <div class="flex flex-column gap-2">
      <label for="ubicacionMaps" class="font-bold">Ubicación</label>
      <textarea pTextarea id="ubicacionMaps" formControlName="ubicacionMaps" rows="3"></textarea>
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <p-button label="Cancelar" icon="pi pi-times" [text]="true" (onClick)="onCancel()" />
      <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
